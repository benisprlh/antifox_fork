services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antifox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-antifox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antifox} -d ${POSTGRES_DB:-antifox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  antifox:
    image: antifox-english:local
    build:
      context: .
      args:
        BINARY_SOURCE: source
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTIFOX_PG_DSN: postgres://${POSTGRES_USER:-antifox}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-antifox}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTIFOX_LLM_PROVIDER: ${ANTIFOX_LLM_PROVIDER:-}
      ANTIFOX_LLM_MODEL: ${ANTIFOX_LLM_MODEL:-}
      ANTIFOX_LLM_BASE_URL: ${ANTIFOX_LLM_BASE_URL:-}
      ANTIFOX_LLM_PROXY: ${ANTIFOX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "8788:8788"
    volumes:
      # Bind the data directory (including jwt.key and local data files) to data/
      # for inspection and backups on the host, and persistence across container rebuilds.
      - ./data:/app/data
      # Mount the project skills directory over the image's /app/skills.
      # Skill edits are read from the host without rebuilding the image.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
